<!DOCTYPE html>
<html lang="en" data-mono>
<head>
    <meta charset="UTF-8">
    <!--
        The launcher frames this game. This document frames nothing, so frame-src
        is 'none'. `child-src 'self'` used to sit beside it and would allow a frame
        in a browser that still treats child-src as the frame fallback.
        `frame-ancestors` is ignored inside a <meta> CSP. The local dev server sends
        X-Frame-Options: SAMEORIGIN so the launcher can frame this page. It does not
        send frame-ancestors. GitHub Pages sends neither.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), clipboard-read=(), usb=(), midi=(), serial=(), display-capture=(), accelerometer=(), gyroscope=(), magnetometer=(), idle-detection=(), screen-wake-lock=(), browsing-topics=(), interest-cohort=()">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Seclusa Pyramid — pair them off and clear the deck. Ported from Tobias Bielefeld's GPL-3.0 Android app. No ads, no tracking, all local.">
    <meta name="theme-color" content="#0d2340">
    <meta name="color-scheme" content="light dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Seclusa Pyramid">
    <meta name="application-name" content="Seclusa Pyramid">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="icon-512.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="icon-512.png" sizes="512x512">
    <title>Seclusa Pyramid</title>

    <!-- Shared design system first, then the card-game board styles on top of it. -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="seclusa-base.css">
    <link rel="stylesheet" href="mono.css">
    <link rel="stylesheet" href="cards/cards.css">

    <!--
        Shared theme bootstrap. Sets data-palette / data-theme before first paint
        (no `defer` on purpose) and listens for `storage` so a palette change made
        in the launcher — or in another game — lands here without a reload.
    -->
    <script src="theme-game.js"></script>
    <meta name="version" content="0.1.1">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="stand.css">
</head>
<body>
    <noscript>
        <p class="noscript-note">JavaScript is required to play Pyramid. Everything runs locally in your browser.</p>
    </noscript>
    <div id="app"></div>

    <footer class="game-foot">
        <p class="game-credits">
            Forked from
            <a href="https://github.com/TobiasBielefeld/Simple-Solitaire" target="_blank" rel="noopener noreferrer">Simple Solitaire Collection</a>
            via <a href="https://github.com/ambr3/Seclusa-Solitaire" target="_blank" rel="noopener noreferrer">Seclusa Solitaire</a>.
            <a href="LICENSE">GPL-3.0</a>
            · <a href="https://github.com/ambr3/seclusa-pyramid" target="_blank" rel="noopener noreferrer">Source</a>
            · Made with <span class="heart" role="img" aria-label="love">&#10084;&#65039;</span>
            <svg class="flag" viewBox="0 0 60 30" role="img" aria-label="United Kingdom">
                <clipPath id="game-uk-clip"><rect width="60" height="30" /></clipPath>
                <g clip-path="url(#game-uk-clip)">
                    <rect width="60" height="30" fill="#012169" />
                    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6" />
                    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4" />
                    <path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10" />
                    <path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6" />
                </g>
            </svg>
        </p>
    </footer>

    <script type="module" src="main.js"></script>
    <script src="stand-help.js"></script>
    <script src="stand.js"></script>
</body>
</html>
